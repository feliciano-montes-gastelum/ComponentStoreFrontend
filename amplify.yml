version: 1
applications:
  - appRoot: .
    env:
      variables:
        NODE_ENV: production
        NPM_CACHE_LOCATION: ~/.npm
        NODE_VERSION: 22.22.3
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --legacy-peer-deps
            - echo "Installed dependencies successfully"
        build:
          commands:
            - echo "Starting build process"
            - npm run build
            - echo "Build completed successfully"
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      files:
        - '**/*.html'
        - '**/*.css'
        - '**/*.js'
        - '**/*.json'
    backend:
      phases:
        build:
          commands:
            - echo "Backend build phase"
