<div class="app-page">
  <app-page-header title="Component types" description="Categories used to organize inventory components.">
    <button mat-flat-button type="button" (click)="openCreate()">
      <mat-icon aria-hidden="true">add</mat-icon>
      New type
    </button>
  </app-page-header>

  @if (loading()) {
    <app-loading-spinner label="Loading component types…"></app-loading-spinner>
  } @else if (items().length === 0) {
    <app-empty-state icon="category" title="No component types yet">
      <button mat-flat-button type="button" (click)="openCreate()">New type</button>
    </app-empty-state>
  } @else {
    <div class="app-table-scroll">
      <table mat-table [dataSource]="items()">
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let item">{{ item.code }}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let item">{{ item.name }}</td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let item">{{ item.description }}</td>
        </ng-container>
        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Active</th>
          <td mat-cell *matCellDef="let item">
            <mat-slide-toggle
              [checked]="item.active"
              [disabled]="togglingId() === item.id"
              (change)="toggleActive(item)"
              [attr.aria-label]="(item.active ? 'Deactivate ' : 'Activate ') + item.name"
            ></mat-slide-toggle>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef><span class="app-visually-hidden">Actions</span></th>
          <td mat-cell *matCellDef="let item">
            <button mat-icon-button type="button" (click)="openEdit(item)" [attr.aria-label]="'Edit ' + item.name">
              <mat-icon aria-hidden="true">edit</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  }
</div>
