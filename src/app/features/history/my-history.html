<div class="app-page">
  <app-page-header
    title="My purchase history"
    description="A record of components you've picked up or purchased in person. This store does not process online payments."
  >
  </app-page-header>

  @if (loading()) {
    <app-loading-spinner label="Loading your history…"></app-loading-spinner>
  } @else if (sales().length === 0) {
    <app-empty-state icon="history" title="No history yet" description="Completed pickups will appear here."></app-empty-state>
  } @else {
    <div class="app-table-scroll">
      <table mat-table [dataSource]="sales()" class="app-history-table">
        <ng-container matColumnDef="saleDate">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let sale">{{ sale.saleDate | date: 'medium' }}</td>
        </ng-container>
        <ng-container matColumnDef="inventoryName">
          <th mat-header-cell *matHeaderCellDef>Component</th>
          <td mat-cell *matCellDef="let sale">{{ sale.inventoryName }}</td>
        </ng-container>
        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef>Qty</th>
          <td mat-cell *matCellDef="let sale">{{ sale.quantity }}</td>
        </ng-container>
        <ng-container matColumnDef="unitPrice">
          <th mat-header-cell *matHeaderCellDef>Unit price</th>
          <td mat-cell *matCellDef="let sale">{{ sale.unitPrice | currency }}</td>
        </ng-container>
        <ng-container matColumnDef="totalPrice">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let sale">{{ sale.totalPrice | currency }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex()"
      [hidePageSize]="true"
      (page)="onPage($event)"
      aria-label="Select page of purchase history"
    >
    </mat-paginator>
  }
</div>
